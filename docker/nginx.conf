server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The page derives authenticator material in the browser; nothing it
    # produces should be cached by the browser or any intermediary.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Everything is inline and self-contained. connect-src 'none' guarantees
    # the page cannot send a seed or a sheet anywhere.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
